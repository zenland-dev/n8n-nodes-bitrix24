name: Bug report
description: Something in the nodes behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Issues here are public. Remove the webhook token (the part of the URL after /rest/)
        and the portal address before pasting anything, and strip client names, phone
        numbers and e-mails out of any sample.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: The n8n version and the version of this package.
      placeholder: "n8n 2.3.1, @zenland-dev/n8n-nodes-bitrix24 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: node
    attributes:
      label: Which node
      options:
        - Bitrix24 (Method, Batch, Portal)
        - Bitrix24 CRM
        - Bitrix24 Trigger
        - Bitrix24 Tasks
        - Bitrix24 Messenger
        - Bitrix24 Messenger Trigger
        - Bitrix24 Open Lines
        - Bitrix24 Chatbot
        - Bitrix24 Chatbot Trigger
        - Bitrix24 Drive
        - Bitrix24 Calendar
    validations:
      required: true

  - type: input
    id: operation
    attributes:
      label: Resource and operation
      placeholder: "Deal → Get Many"

  - type: textarea
    id: response
    attributes:
      label: What Bitrix24 answered
      description: >
        The error text the node showed, with the code in square brackets, e.g.
        "Bitrix24 crm.item.add: … [ACCESS_DENIED]". Many Bitrix24 errors depend on the rights
        of the user who created the webhook, so say whether that user is an administrator.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Plan (the limits differ on Enterprise), whether the portal is cloud, and for the
        trigger the event code and one sample delivery with the application token removed.
