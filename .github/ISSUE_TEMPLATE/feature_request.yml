name: Feature request
description: A missing method, module or convenience
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The workflow you are building, not only the method you are missing.
    validations:
      required: true

  - type: input
    id: method
    attributes:
      label: The Bitrix24 method, if you know it
      placeholder: "tasks.task.add"

  - type: textarea
    id: docs
    attributes:
      label: Where it is documented
      description: >
        A link to apidocs.bitrix24.com. Calendar, telephony, business processes, the store,
        sites, booking and mail have no node yet;
        until they do, the Bitrix24 node calls their methods by name. Say which module you
        need first.
